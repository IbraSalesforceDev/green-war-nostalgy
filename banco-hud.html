<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1206" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1206'/%3E%3Crect x='4' y='6' width='24' height='5' rx='1' fill='%23e8b64c'/%3E%3Crect x='4' y='14' width='14' height='5' rx='1' fill='%238b2c1d'/%3E%3Crect x='4' y='22' width='19' height='4' rx='1' fill='%234a4136'/%3E%3C/svg%3E"
    />
    <meta name="description" content="Banco de pruebas del HUD: barra de recursos, carta de comandos, panel de selección, minimapa, avisos y menús." />
    <title>Banco de HUD — Nostalgia de la Guerra Verde</title>
    <style>
      :root {
        --pergamino: #d9c49a;
        --tinta: #2b1d0e;
        --oro: #e8b64c;
        --sangre: #8b2c1d;
        --piedra: #4a4136;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0805;
        color: var(--pergamino);
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        -webkit-touch-callout: none;
        overscroll-behavior: none;
        touch-action: none;
      }
      #lienzo {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #capa-ui {
        position: fixed;
        inset: 0;
        pointer-events: none;
        z-index: 10;
      }
      #aviso-error {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #0a0805;
      }
      #aviso-error h1 {
        color: var(--sangre);
        font-size: 1.2rem;
        letter-spacing: 0.08em;
      }
      #aviso-error pre {
        max-width: 90vw;
        max-height: 60vh;
        overflow: auto;
        padding: 1rem;
        background: #140f08;
        border: 1px solid #3a2f1c;
        color: #b09a70;
        font-size: 0.72rem;
        text-align: left;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <!--
      Banco de pruebas del HUD: WASD/flechas desplazan la cámara, la rueda hace zoom.
      Parámetros: ?vista=edificio|obrero|tropa|construir|multiple|enemigo|vacio, ?semilla=1234
    -->
    <canvas id="lienzo"></canvas>
    <div id="capa-ui" aria-live="polite"></div>

    <div id="aviso-error">
      <h1>El banco no ha arrancado</h1>
      <pre id="detalle-error"></pre>
    </div>

    <script type="module" src="/src/bancos/hud.ts"></script>
  </body>
</html>
