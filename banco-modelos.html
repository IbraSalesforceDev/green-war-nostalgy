<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1206" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1206'/%3E%3Ccircle cx='12' cy='13' r='5' fill='%232f63d8'/%3E%3Ccircle cx='21' cy='13' r='5' fill='%23b52d20'/%3E%3Crect x='8' y='20' width='16' height='6' rx='1' fill='%23e8b64c'/%3E%3C/svg%3E"
    />
    <meta name="description" content="Banco de pruebas de unidades, edificios y adornos." />
    <title>Banco de modelos — Nostalgia de la Guerra Verde</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0805;
        color: #d9c49a;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        touch-action: none;
      }
      #lienzo {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #panel {
        position: fixed;
        top: 10px;
        left: 10px;
        z-index: 20;
        background: rgba(10, 8, 5, 0.72);
        border: 1px solid #3a2f1c;
        border-radius: 6px;
        padding: 0.6rem 0.8rem;
        font-size: 0.72rem;
        line-height: 1.5;
        max-width: 26rem;
        pointer-events: none;
      }
      #panel b {
        color: #e8b64c;
      }
      #aviso-error {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #0a0805;
      }
      #aviso-error pre {
        max-width: 90vw;
        max-height: 60vh;
        overflow: auto;
        padding: 1rem;
        background: #140f08;
        border: 1px solid #3a2f1c;
        color: #b09a70;
        font-size: 0.72rem;
        text-align: left;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>
    <div id="panel">
      <b>Banco de modelos</b><br />
      Rejilla: unidades (humanos izq. / orcos der.), edificios detrás, adornos al fondo.<br />
      Parámetros: <b>?estado=</b>inactivo|caminando|atacando|recolectando|construyendo|muriendo|ciclo,
      <b>?vista=</b>juego, <b>?fila=</b>0-4
    </div>

    <div id="aviso-error">
      <h1>El banco no ha arrancado</h1>
      <pre id="detalle-error"></pre>
    </div>

    <script type="module" src="/src/bancos/modelos.ts"></script>
  </body>
</html>
