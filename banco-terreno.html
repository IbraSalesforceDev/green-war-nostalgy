<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#1a1206" />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231a1206'/%3E%3Cpath d='M4 22l7-9 5 6 4-5 8 8z' fill='%236f9c3f'/%3E%3C/svg%3E"
    />
    <meta name="description" content="Banco de pruebas del terreno, el agua, el cielo y la vegetación." />
    <title>Banco de terreno — Nostalgia de la Guerra Verde</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0a0805;
        color: #d9c49a;
        font-family: 'Trebuchet MS', 'Segoe UI', system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
        overscroll-behavior: none;
        touch-action: none;
      }
      #lienzo {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
      }
      #aviso-error {
        position: fixed;
        inset: 0;
        z-index: 200;
        display: none;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1rem;
        padding: 2rem;
        text-align: center;
        background: #0a0805;
      }
      #aviso-error pre {
        max-width: 90vw;
        max-height: 60vh;
        overflow: auto;
        padding: 1rem;
        background: #140f08;
        border: 1px solid #3a2f1c;
        color: #b09a70;
        font-size: 0.72rem;
        text-align: left;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <canvas id="lienzo"></canvas>

    <div id="aviso-error">
      <h1>El banco no ha arrancado</h1>
      <pre id="detalle-error"></pre>
    </div>

    <script type="module" src="/src/bancos/terreno.ts"></script>
  </body>
</html>
